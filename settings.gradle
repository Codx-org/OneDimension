pluginManagement {
	repositories {
		maven {
			name = 'Fabric'
			url = 'https://maven.fabricmc.net/'
		}
		mavenCentral()
		gradlePluginPortal()
	}
}

// Planeshift is built from the sibling checkout rather than a published jar, so a change
// there is picked up here without publishing anything. Point this at wherever you keep it.
includeBuild '../planeshift'

// CustomChunks, which the stacked world is generated by, the same way.
includeBuild '../customchunks-template-26.3'

// Should match your modid
rootProject.name = 'one-dimension'
